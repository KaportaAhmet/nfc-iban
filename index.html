<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ödeme Bilgileri</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --accent: #10b981;
            --accent-hover: #059669;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border);
            text-align: center;
        }

        .logo-box {
            width: 72px;
            height: 72px;
            background: var(--border);
            border-radius: 20px;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            overflow: hidden;
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .title {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
            color: var(--text-main);
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 24px;
        }

        .card {
            background: #0f172a;
            border-radius: 16px;
            padding: 18px;
            border: 1px solid var(--border);
            margin-bottom: 16px;
            text-align: left;
        }

        .label {
            font-size: 12px;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
        }

        .iban-text {
            font-family: monospace;
            font-size: 17px;
            font-weight: 600;
            word-break: break-all;
            color: #38bdf8;
            letter-spacing: 1px;
            line-height: 1.4;
        }

        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: var(--accent);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .btn:active {
            transform: scale(0.98);
            background: var(--accent-hover);
        }

        .btn-wa {
            background: #25d366;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.2);
            display: none;
            text-decoration: none;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #10b981;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .footer {
            margin-top: 20px;
            font-size: 11px;
            color: var(--text-sub);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-box" id="logoBox">🏪</div>
        <h1 class="title" id="name">İşletme / Hesap Sahibi</h1>
        <p class="subtitle" id="bank">Banka Hesabı</p>

        <div class="card">
            <div class="label">
                <span>IBAN NUMARASI</span>
                <span id="bankTag" style="color: var(--accent);">—</span>
            </div>
            <div class="iban-text" id="iban">TR00 0000 0000 0000 0000 0000 00</div>
        </div>

        <button class="btn" id="copyBtn" onclick="copyIban()">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
            IBAN'ı Kopyala
        </button>

        <a id="waBtn" href="#" class="btn btn-wa">
            WhatsApp İle İletişime Geç
        </a>

        <div class="footer">NFC Dijital Ödeme Sistemi</div>
    </div>

    <div class="toast" id="toast">IBAN Başarıyla Kopyalandı!</div>

    <script>
        const params = new URLSearchParams(window.location.search);
        
        const isim = params.get('isim') || 'İşletme Adı Belirtilmedi';
        const iban = params.get('iban') || 'IBAN Bulunamadı';
        const banka = params.get('banka') || 'Banka Belirtilmedi';
        const logo = params.get('logo');
        const telefon = params.get('telefon');

        document.getElementById('name').textContent = isim;
        document.getElementById('iban').textContent = iban;
        document.getElementById('bank').textContent = banka;
        document.getElementById('bankTag').textContent = banka;

        if (logo) {
            document.getElementById('logoBox').innerHTML = `<img src="${logo}" alt="Logo">`;
        }

        if (telefon) {
            const waBtn = document.getElementById('waBtn');
            waBtn.style.display = 'flex';
            waBtn.href = `https://wa.me/${telefon}?text=Merhaba,%20ödeme%20hakkında%20bilgi%20almak%20istiyorum.`;
        }

        function copyIban() {
            const cleanIban = iban.replace(/\s+/g, '');
            navigator.clipboard.writeText(cleanIban).then(() => {
                showToast();
            }).catch(() => {
                const textArea = document.createElement("textarea");
                textArea.value = cleanIban;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand("copy");
                document.body.removeChild(textArea);
                showToast();
            });
        }

        function showToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }
    </script>
</body>
</html>
